name: Suggest a myth
description: A playground legend this mod should make true.
title: "[myth] "
labels: ["myth", "idea"]
body:
  - type: markdown
    attributes:
      value: |
        Four myths are in. Four is not the list — every playground had its
        own, and the local ones are better than the famous ones. Describe it
        and it gets considered; you do not need to know any Lua.
  - type: input
    id: name
    attributes:
      label: What was it called?
      placeholder: "Mew under the truck, Pikablu, the 152nd Pokemon..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What were you supposed to do?
      description: >
        The exact steps as you were told them, however absurd. "Do not get on
        the ship, surf back, use Strength a hundred times" is precisely the
        level of detail that is useful.
    validations:
      required: true
  - type: textarea
    id: payoff
    attributes:
      label: And what was supposed to happen?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where and roughly when did you hear it?
      placeholder: "playground in Naples, about 1999"
  - type: checkboxes
    id: rules
    attributes:
      label: One check
      options:
        - label: This is a myth, a rumour or a memory - not a copy of another game's or another mod's content.
          required: true
